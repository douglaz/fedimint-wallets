name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repo. Declared explicitly so the workflow does
# not silently gain write scope if the repository default changes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE GATE. These three steps are the same checks AGENTS.md documents as the local gate:
  #   nix develop -c bash -c 'cargo fmt --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace'
  # Split into separate steps here so a failure names which check failed rather than one
  # opaque red step; keep them in sync with AGENTS.md, since a CI gate that is weaker than
  # the documented local one teaches people to trust the wrong signal.
  gate:
    name: fmt + clippy + test (nix devshell)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The fedimint SDK tree and RocksDB are large, and target/ grows past what a stock
      # runner has free. Reclaim before building rather than failing halfway through.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1

      # `access-tokens` is not optional here: this flake fetches flakebox from GitHub at a
      # pinned rev, and unauthenticated runners hit the API rate limit intermittently, which
      # presents as a mysterious flake-input failure rather than a rate-limit message.
      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # Caches the cargo registry and target/ keyed on Cargo.lock, so the expensive first
      # build of the fedimint/RocksDB tree is paid only on a cache miss.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: fmt
        run: nix develop . --command cargo fmt --check

      # `-D warnings` is deliberate: a warning that only prints is a warning nobody reads,
      # and this tree is clean under it. If a rustc/clippy bump lands a new lint and floods
      # CI, fix it or #[allow] it with a reason — do not drop the flag.
      #
      # `--locked` fails if the build would need to change Cargo.lock, so a dependency
      # cannot drift silently in CI.
      - name: clippy
        run: nix develop . --command cargo clippy --workspace --all-targets --locked -- -D warnings

      # No `-- -D warnings` here: after `--`, cargo test forwards arguments to the test
      # BINARY, not to rustc, and libtest rejects it. Lint coverage of test code comes from
      # `--all-targets` on the clippy step above.
      - name: test
        run: nix develop . --command cargo test --workspace --locked

  # Proves the SHIPPED artifact builds, which the devshell gate above does not: `nix build`
  # goes through the flakebox derivation rather than the dev profile, so it can fail while
  # `cargo build` succeeds. Separate job so it runs in parallel with the gate and gives an
  # independent signal.
  nix-build:
    name: nix build (walletd)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1

      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: build the default package
        run: nix build .# --print-build-logs

      # A build that produces an unrunnable binary is not a passing build. `--version` is
      # NOT accepted by this daemon (clap rejects it); `--help` exits 0 and is the cheapest
      # thing that proves the binary links and starts.
      - name: smoke the built binary
        run: ./result/bin/walletd --help > /dev/null

# NOT gated here, deliberately:
#
# The live devimint evacuation gate (wallet-cli/tests/smoke_evacuate_devimint.sh) needs a
# devimint built from a pinned fedimint worktree with a local patch applied, and drives real
# federations. It is not reproducible from a clean runner, so it stays a local gate that
# money-adjacent changes run by hand — see AGENTS.md. Adding a green CI job that silently
# skips it would be worse than not having one.
