[package]
name = "wallet-fedimint"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

# Phase 1: the pure `move_protocol` (step 1) plus the fedimint SDK integration
# (steps 2-4). The dependency remains pinned to the owner's douglaz/fedimint fork;
# the authoritative current branch, revision, and carried fixes are documented
# immediately above the dependency list below. Revisit that pin before production.
# NOTE: from here the crate needs the nix build env for fedimint's native deps —
# use the target-pinned commands under README.md "Local development".
[dependencies]
wallet-core = { path = "../wallet-core" }
wallet-api = { path = "../wallet-api" }
# All fedimint crates share ONE git source + rev. Pinned to douglaz/fedimint
# `wallet-pin/iroh-recovery-tpe8838` (72b1e5b) = the iroh long-poll branch (63ab515)
# + a cherry-pick making a failed module recovery reportable instead of parking
# forever (upstreaming as fix/recovery-failure-is-determinate; seed recovery br-m9m
# needs complete-or-fail) + a cherry-pick of the #8838 single-share TPE fix (e350cd7):
# without it, lnv2 decryption on a SINGLE-GUARDIAN federation panics in
# lagrange_multipliers (the #8837 sm-executor freeze) — devimint's 4-guardian setup
# never exercises it, single-guardian PILOT feds do (br-fix-pin-tpe-8838).
fedimint-core = { git = "https://github.com/douglaz/fedimint.git", rev = "72b1e5beadc5a31a33ebc751764cb2f840a63b5e" }
fedimint-api-client = { git = "https://github.com/douglaz/fedimint.git", rev = "72b1e5beadc5a31a33ebc751764cb2f840a63b5e" }
fedimint-client = { git = "https://github.com/douglaz/fedimint.git", rev = "72b1e5beadc5a31a33ebc751764cb2f840a63b5e" }
fedimint-bip39 = { git = "https://github.com/douglaz/fedimint.git", rev = "72b1e5beadc5a31a33ebc751764cb2f840a63b5e" }
fedimint-rocksdb = { git = "https://github.com/douglaz/fedimint.git", rev = "72b1e5beadc5a31a33ebc751764cb2f840a63b5e" }
# `ConnectorRegistry` (join/open need it) is already resolved transitively via
# fedimint-client, so pinning it directly adds no new version to the lockfile.
fedimint-connectors = { git = "https://github.com/douglaz/fedimint.git", rev = "72b1e5beadc5a31a33ebc751764cb2f840a63b5e" }
fedimint-mint-client = { git = "https://github.com/douglaz/fedimint.git", rev = "72b1e5beadc5a31a33ebc751764cb2f840a63b5e" }
fedimint-wallet-client = { git = "https://github.com/douglaz/fedimint.git", rev = "72b1e5beadc5a31a33ebc751764cb2f840a63b5e" }
fedimint-ln-client = { git = "https://github.com/douglaz/fedimint.git", rev = "72b1e5beadc5a31a33ebc751764cb2f840a63b5e" }
fedimint-lnv2-client = { git = "https://github.com/douglaz/fedimint.git", rev = "72b1e5beadc5a31a33ebc751764cb2f840a63b5e" }
fedimint-lnv2-common = { git = "https://github.com/douglaz/fedimint.git", rev = "72b1e5beadc5a31a33ebc751764cb2f840a63b5e" }
# `Bolt11Invoice` (the type lnv2 `send`/`receive` speak) — pinned to the SAME version
# fedimint's workspace uses (0.33), so it resolves to the one copy already in the lockfile;
# depending on it directly adds no new version and guarantees the exact same type.
lightning-invoice = "0.33"
# `bitcoin::Network` (the type `WalletClientModule::get_network` returns, used by the
# probe runner to derive `is_mainnet`) — pinned to the SAME version fedimint's
# workspace uses (0.32), so it resolves to the one copy already in the lockfile and
# the `Network` type matches exactly (a mismatched copy would not compare equal).
bitcoin = "0.32"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time"] }
